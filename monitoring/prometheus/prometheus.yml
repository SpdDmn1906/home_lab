global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'homelab'
    environment: 'production'

# Alertmanager configuration (optional, can add later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Docker containers (via cAdvisor)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(.*)'
        target_label: __name__
        replacement: 'docker_$1'

  # Speedtest Exporter - Network performance
  - job_name: 'speedtest'
    static_configs:
      - targets: ['speedtest-exporter:9798']
    scrape_interval: 5m

  # Plex Media Server (if exporter available)
  - job_name: 'plex'
    static_configs:
      - targets: ['plex:32400']
    metrics_path: /metrics
    scrape_interval: 1m

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # Security cameras and IoT device monitoring
  - job_name: 'security_devices'
    static_configs:
      - targets:
        # Nest cameras (if they support monitoring)
        # Eufy Homebase (if accessible)
        # Abode hub (if accessible)
    scrape_interval: 60s

  # Gaming console monitoring (if supported)
  - job_name: 'gaming_devices'
    static_configs:
      - targets:
        # PS5 (if network monitoring available)
        # Nintendo Switch (if network monitoring available)
    scrape_interval: 30s

  # IoT device monitoring (smart home devices)
  - job_name: 'iot_devices'
    static_configs:
      - targets:
        # Smart plugs, bulbs, LED strips monitoring
    scrape_interval: 60s

