services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - NTFY_BASE_URL=http://<tailscale-ip>:8095  # MUST exactly match the server address configured in the subscribing app - see docs/guides/tailscale-ntfy-push-setup.md
      - NTFY_LISTEN_HTTP=:80
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=read-write
      - NTFY_BEHIND_PROXY=false
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh  # required for iOS push - see docs/guides/tailscale-ntfy-push-setup.md
    volumes:
      - /home/youruser/Docker/ntfy/cache:/var/cache/ntfy
      - /home/youruser/Docker/ntfy/etc:/var/lib/ntfy
    ports:
      - "8095:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q healthy || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
